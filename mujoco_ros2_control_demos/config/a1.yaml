controller_manager:
  ros__parameters:
    update_rate: 100  # Часто для A1 ставят 100 Гц
    use_sim_time: true

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    a1_joint_controller:
      type: effort_controllers/JointGroupEffortController

joint_state_broadcaster:
  ros__parameters: {}

a1_joint_controller:
  ros__parameters:
    joints:
      - FR_hip_joint
      - FR_thigh_joint
      - FR_calf_joint
      - FL_hip_joint
      - FL_thigh_joint
      - FL_calf_joint
      - RR_hip_joint
      - RR_thigh_joint
      - RR_calf_joint
      - RL_hip_joint
      - RL_thigh_joint
      - RL_calf_joint
    command_interfaces:
      - effort
    state_interfaces:
      - position
      - velocity